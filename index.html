<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Gym Tracker – Übungen nach Muskelgruppe, Gewicht und Wiederholungen pro Tag, Gym-Besuche und Leistungsfortschritt.">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gym Tracker">
  <title>Gym Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand" aria-label="Gym Tracker"><span>Gym</span> Tracker</div>
      <div id="topbar-actions"></div>
    </header>
    <main id="view"></main>
  </div>

  <nav id="tabbar" class="tabbar" aria-label="Hauptnavigation"></nav>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <dialog id="confirm" class="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-text"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Gym Tracker braucht JavaScript.</p></noscript>

  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
